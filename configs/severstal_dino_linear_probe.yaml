seed: 42

data:
  root: data/severstal
  image_shape: [256, 1600]
  num_classes: 4

cv:
  n_folds: 5
  stratify: true
  shuffle: true

patch_eval:
  gt_overlap_threshold: 0.5
  # Overridden by optimal F1 threshold after training when running CV
  pred_score_threshold: 0.5

detector:
  name: dino_linear_probe
  model_name: dinov2_vits14
  resolution: 448
  # null = all train-fold images; -1 = all class_balanced eligible; N = k-shot
  shots: 8
  reference_sampling: class_balanced  # class_balanced | defect_free
  classification_mode: binary_multiclass  # binary | binary_multiclass
  binary_loss: focal  # bce | focal
  focal_gamma: 2.0
  focal_alpha: 0.25
  lambda_mc: 1.0
  lr: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 4
  epochs: 30
  num_workers: 0
  threshold_num_steps: 101
  checkpoint_path: null  # if set, fit()/train loads instead of training
  device: cuda:0

train:
  output_dir: results_train
  save_plots: true
  log_format: both  # csv | json | both

segmenter:
  name: sam2
  model: sam2.1_b.pt
  prompt_mode: bbox
  min_prompt_area: 1
  device: cuda:0

output:
  dir: results_severstal
  save_visualizations: true
  max_viz_images_per_fold: 20
