seed: 42

data:
  root: data/severstal
  image_shape: [256, 1600]
  num_classes: 4

cv:
  n_folds: 5
  stratify: true
  shuffle: true

patch_eval:
  gt_overlap_threshold: 0.5
  # Tune per score_mode — see README dino_sobel section
  pred_score_threshold: 0.35

detector:
  name: dino_sobel
  model_name: dinov2_vits14
  resolution: 448
  device: cuda:0
  shots: 8                        # 0 = zero-shot; >0 = few-shot calibration
  reference_sampling: class_balanced

  sobel:
    norm_reduction: l2            # l2 | mean | max

  score_mode: raw                 # raw | per_image_zscore | per_image_iqr | per_image_percentile
  zscore_k: 2.0
  iqr_k: 1.5
  percentile: 95

  masking: false

segmenter:
  name: sam2
  model: sam2.1_b.pt
  prompt_mode: bbox
  min_prompt_area: 1
  device: cuda:0

output:
  dir: results_severstal
  save_visualizations: true
  max_viz_images_per_fold: 20
