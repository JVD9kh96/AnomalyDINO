seed: 42

data:
  root: data/severstal
  image_shape: [256, 1600]
  num_classes: 4

cv:
  n_folds: 5
  stratify: true
  shuffle: true

patch_eval:
  gt_overlap_threshold: 0.5
  # IsolationForest score scale is detector/data dependent; tune this after fold 0.
  pred_score_threshold: 0.5

detector:
  name: dino_sobel_raw_pca_iforest
  model_name: dinov2_vits14
  resolution: 448
  device: cuda:0

  # k-shot references used to fit PCA and IsolationForest.
  shots: 8
  reference_sampling: defect_free

  # Optional DINOv2 PCA foreground masking. Keep false for a first baseline.
  masking: false
  mask_ref_images: false

  # Per-branch dimensionality after PCA:
  #   Sobel-image DINO patch tokens -> 3
  #   Raw-image DINO patch tokens   -> 3
  #   Concatenated IsolationForest vector -> 6
  pca:
    components: 3
    whiten: false

  sobel:
    kernel_size: 3

  standardize: true

  iforest:
    n_estimators: 200
    max_samples: auto
    contamination: auto
    max_features: 1.0
    bootstrap: false
    n_jobs: -1

segmenter:
  name: sam2
  model: sam2.1_b.pt
  prompt_mode: bbox
  min_prompt_area: 1
  device: cuda:0

output:
  dir: results_severstal
  save_visualizations: true
  max_viz_images_per_fold: 20
