seed: 42

data:
  root: data/severstal
  image_shape: [256, 1600]
  num_classes: 4

cv:
  n_folds: 5
  stratify: true
  shuffle: true

patch_eval:
  gt_overlap_threshold: 0.5
  # Tune with: python scripts/tune_patch_threshold.py --config configs/severstal_dino_iforest_rollout.yaml --fold 0
  pred_score_threshold: 0.5

detector:
  name: dino_iforest_rollout
  model_name: dinov2_vits14
  resolution: 448
  device: cuda:0
  shots: 8
  reference_sampling: class_balanced

  masking: false
  mask_ref_images: false
  rotation: false
  neighbor_aggregate: false
  coreset_ratio: null

  iforest:
    n_estimators: 200
    max_samples: auto
    contamination: auto
    max_features: 1.0
    bootstrap: false
    n_jobs: -1

  attention_rollout:
    average_heads: true
    include_residual: true
    discard_ratio: 0.7
    last_n_layers: 4
    head_reduction: max

  fusion:
    mode: weighted_sum
    iforest_weight: 0.5
    rollout_weight: 0.5

segmenter:
  name: sam2
  model: sam2.1_b.pt
  prompt_mode: bbox
  min_prompt_area: 1
  device: cuda:0

output:
  dir: results_severstal
  save_visualizations: true
  max_viz_images_per_fold: 20

