seed: 42

data:
  root: data/severstal
  image_shape: [256, 1600]
  num_classes: 4

cv:
  n_folds: 5
  stratify: true
  shuffle: true

patch_eval:
  gt_overlap_threshold: 0.5
  pred_score_threshold: 10.525639 

detector:
  name: dino_mahalanobis
  model_name: dinov2_vits14
  resolution: 448
  device: cuda:0
  layers: last
  pca_components: 50
  prototype_reference_sampling: defect_free
  neighbor_aggregate: false
  shots: 8
  reference_sampling: defect_free

segmenter:
  name: sam2
  model: sam2.1_b.pt
  prompt_mode: bbox
  min_prompt_area: 1
  device: cuda:0

output:
  dir: results_severstal
  save_visualizations: true
  max_viz_images_per_fold: 20
