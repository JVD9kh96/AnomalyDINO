
seed: 42

data:
  root: data/severstal
  image_shape: [256, 1600]
  num_classes: 4

cv:
  n_folds: 5
  stratify: true
  shuffle: true

patch_eval:
  gt_overlap_threshold: 0.5
  pred_score_threshold: 0.220198

detector:
  name: anomaly_dino
  model_name: dinov2_vits14
  resolution: 224
  shots: 32                       # must be divisible by num_classes (4) for class_balanced
  reference_sampling: class_balanced  # class_balanced | defect_free
  knn_metric: L2_normalized
  k_neighbors: 5
  faiss_on_cpu: false
  masking: false
  mask_ref_images: false
  rotation: false
  device: cuda:0

segmenter:
  name: sam2
  model: sam2.1_b.pt
  prompt_mode: bbox
  min_prompt_area: 1
  device: cuda:0

output:
  dir: results_severstal
  save_visualizations: true
  max_viz_images_per_fold: 20
